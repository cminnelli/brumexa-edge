<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brumexa — Logs</title>
  <!-- Red de seguridad contra íconos SVG "gigantes" antes de que cargue
       style.css — ver el mismo comentario en public/index.html. -->
  <style>svg { width: 1em; height: 1em; }</style>
  <script>
    (function () {
      var t = localStorage.getItem('brumexa-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- No-bloqueante (media=print + onload) — ver el comentario grande en
       public/local.html: esta página también se ve conectado al AP de
       emergencia, sin internet real, y un <link rel=stylesheet> normal a
       un dominio externo sin ruta a internet traba el render entero. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/style.css?v=25" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
    .logs-wrap { flex: 1; min-height: 0; display: flex; }
    .logs-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
    .logs-panel + .logs-panel { border-left: 1px solid var(--border); }
    .logs-panel__header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .logs-panel__title { font-weight: 700; font-size: 13px; color: var(--text); flex-shrink: 0; }
    .logs-panel__count { font-size: 11px; color: var(--text2); }
    .logs-filter {
      flex: 1; min-width: 0; padding: 5px 9px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 12px; font-family: 'Consolas', 'Fira Code', monospace;
    }
    .logs-filter:focus { outline: none; border-color: var(--accent); }
    .logs-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--border2); }
    .logs-dot.live { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .logs-dot.down { background: var(--danger); }
    .logs-body {
      flex: 1; overflow-y: auto; padding: 8px 12px;
      font-family: 'Consolas', 'Fira Code', monospace; font-size: 12px; line-height: 1.55;
    }
    .logs-body::-webkit-scrollbar { width: 8px; }
    .logs-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    .log-line { white-space: pre-wrap; word-break: break-word; color: var(--text); padding: 1px 0; }
    .log-line .ts { color: var(--text2); margin-right: 8px; font-variant-numeric: tabular-nums; }
    .log-line.stderr { color: var(--danger); }
    .log-line.hl-gate { color: #22c55e; font-weight: 600; }
    /* Etapa del flujo LiveKit — mismos colores que la terminal (SSH/pm2 logs,
       ver lib/log-stream.js _colorize): cian = mandando tu audio, verde =
       recibiendo al agente, magenta = esperando/conectando. */
    .log-line.hl-tx   { color: #22d3ee; }
    .log-line.hl-rx   { color: #4ade80; }
    .log-line.hl-wait { color: #c084fc; }
    /* Origen del problema (solo warn/error) — "PI" es hardware/red local del
       dispositivo (mic, WiFi, LEDs, Bluetooth), "RED" es el lado remoto
       (rag-api / servidor LiveKit). Le gana el color de warn/error de arriba
       en peso visual porque además llevan .stderr o quedan en amarillo. */
    .log-line.origin-pi::before  { content: '🔧 PI · ';  color: var(--text2); }
    .log-line.origin-red::before { content: '☁️ RED · '; color: var(--text2); }
    .log-line.dim { opacity: .35; }
    /* Hitos (ver EVENTS en lib/log-stream.js) — franja de color a la
       izquierda + fondo suave, para encontrarlos de un vistazo. */
    .log-line.ev {
      font-weight: 700; margin: 4px 0; padding: 4px 10px;
      border-left: 5px solid var(--ev); border-radius: 4px;
      color: var(--ev);
      background: color-mix(in srgb, var(--ev) 20%, transparent);
    }
    .log-line.ev .ts { color: var(--ev); opacity: .75; }
    /* warn en amarillo (como la terminal) y pedidos HTTP atenuados — así
       lo que importa salta a la vista entre el ruido. */
    .log-line.lvl-warn { color: var(--warn); }
    .log-line.dim-req  { opacity: .45; }
    .log-line.ev-voice-on     { --ev: #22c55e; }
    .log-line.ev-voice-off    { --ev: #0ea5e9; }
    .log-line.ev-voice-reject { --ev: #e0a032; }
    .log-line.ev-wake         { --ev: #a855f7; }
    .log-line.ev-session-up   { --ev: #06b6d4; }
    .log-line.ev-session-down { --ev: #ef4444; }
    .log-line.ev-session-wait { --ev: #c084fc; }
    .log-line.ev-system       { --ev: #3b82f6; }
    .log-line.ev-agent-on     { --ev: #14b8a6; }
    .log-line.ev-agent-off    { --ev: #64748b; }
    .logs-empty { color: var(--text2); font-size: 12px; padding: 4px 0; }
    /* Contador de repetidos agrupados (vista Simple) */
    .log-line .rep {
      display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 999px;
      font-size: 11px; font-weight: 700; background: var(--surface2); color: var(--text2);
    }

    /* Barra de arriba: qué paneles ver + nivel de detalle */
    .logs-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
      padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .logs-toolbar__group { display: flex; align-items: center; gap: 8px; }
    .logs-toolbar__group[hidden] { display: none; }
    .logs-toolbar__label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
    .seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); }
    .seg button {
      border: 0; background: transparent; color: var(--text2); cursor: pointer;
      padding: 4px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 600; font-family: inherit;
    }
    .seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .logs-panel[hidden] { display: none; }

    /* La última línea — siempre resaltada (borde de acento + flecha) y con
       un destello al llegar, para que se vea de un vistazo qué acaba de pasar. */
    .log-line.latest {
      outline: 2px solid var(--accent); outline-offset: -1px; border-radius: 4px;
      box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .log-line.latest:not(.ev) { padding: 3px 8px; margin: 3px 0; background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .log-line.latest .ts::before { content: '▶ '; color: var(--accent); }
    .log-line.flash { animation: log-flash .9s ease-out; }
    @keyframes log-flash {
      from { background-color: color-mix(in srgb, var(--accent) 35%, transparent); }
    }

    /* "↓ Ir al último" — solo aparece si subiste a leer algo viejo */
    .logs-panel { position: relative; }
    .logs-jump {
      position: absolute; right: 18px; bottom: 16px; z-index: 5;
      padding: 7px 14px; border-radius: 999px; border: 0; cursor: pointer;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 12.5px; font-family: inherit;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
    }
    .logs-jump[hidden] { display: none; }

    /* Margen abajo: la última línea queda a una altura cómoda de lectura,
       no pegada al borde inferior. */
    .logs-body { padding-bottom: 28vh; }

    /* ─── Tarjeta "Ahora" ─────────────────────────────────────────────── */
    .now {
      --now: #64748b;
      display: flex; align-items: center; gap: 14px;
      margin: 10px 12px 2px; padding: 12px 16px; border-radius: 12px;
      background: color-mix(in srgb, var(--now) 12%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--now) 35%, transparent);
      transition: background .3s, border-color .3s;
    }
    .now[data-state="listening"]  { --now: #64748b; }
    .now[data-state="user"]       { --now: #22c55e; }
    .now[data-state="connecting"] { --now: #a855f7; }
    .now[data-state="connected"]  { --now: #06b6d4; }
    .now[data-state="agent"]      { --now: #14b8a6; }
    .now[data-state="error"]      { --now: #ef4444; }
    .now__icon {
      position: relative; width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      background: color-mix(in srgb, var(--now) 22%, transparent);
    }
    /* Anillo que late — más rápido cuando alguien habla */
    .now__icon::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      border: 2px solid var(--now); opacity: 0; animation: now-ring 2.4s ease-out infinite;
    }
    .now[data-state="user"] .now__icon::after,
    .now[data-state="agent"] .now__icon::after { animation-duration: 1s; }
    .now[data-state="connecting"] .now__icon::after { animation-duration: 1.4s; }
    @keyframes now-ring { 0% { transform: scale(.85); opacity: .7; } 100% { transform: scale(1.35); opacity: 0; } }
    /* Ecualizador — reemplaza al emoji mientras alguien habla */
    .now__eq { display: none; gap: 3px; align-items: flex-end; height: 20px; }
    .now__eq i { width: 4px; border-radius: 2px; background: var(--now); animation: now-eq .9s ease-in-out infinite; }
    .now__eq i:nth-child(2) { animation-delay: -.3s; }
    .now__eq i:nth-child(3) { animation-delay: -.6s; }
    .now__eq i:nth-child(4) { animation-delay: -.15s; }
    @keyframes now-eq { 0%,100% { height: 5px; } 50% { height: 20px; } }
    .now[data-state="user"] .now__emoji, .now[data-state="agent"] .now__emoji { display: none; }
    .now[data-state="user"] .now__eq,    .now[data-state="agent"] .now__eq    { display: flex; }
    .now__text { flex: 1; min-width: 0; }
    .now__title { font-weight: 800; font-size: 16px; color: var(--now); font-family: var(--font-display); }
    .now__sub { font-size: 12.5px; color: var(--text2); }
    .now__since { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ─── Vista Simple como línea de tiempo ("Guitar Hero") ───────────── */
    .logs-body.timeline { position: relative; padding-left: 34px; font-family: var(--font-sans); font-size: 13px; }
    /* Riel vertical */
    .logs-body.timeline::before {
      content: ''; position: absolute; left: 21px; top: 0; bottom: 0; width: 2px;
      background: linear-gradient(to bottom, transparent, var(--border2) 15%, var(--border2));
    }
    .timeline .log-line { position: relative; animation: tl-in .45s cubic-bezier(.2,.8,.2,1); }
    /* Punto sobre el riel, del color del evento */
    .timeline .log-line::after {
      content: ''; position: absolute; left: -18px; top: 50%; width: 10px; height: 10px; margin-top: -5px;
      border-radius: 50%; background: var(--ev, var(--text2)); box-shadow: 0 0 0 3px var(--bg);
    }
    .timeline .log-line.lvl-warn { --ev: var(--warn); }
    .timeline .log-line.stderr   { --ev: var(--danger); }
    .timeline .log-line.latest::after { width: 14px; height: 14px; margin-top: -7px; left: -20px; box-shadow: 0 0 0 3px var(--bg), 0 0 12px var(--ev, var(--accent)); }
    /* Las viejas se van apagando a medida que suben */
    .timeline .log-line:not(:nth-last-child(-n+12)) { opacity: .7; }
    .timeline .log-line:not(:nth-last-child(-n+25)) { opacity: .45; }
    .timeline .log-line.latest { font-size: 14.5px; padding-top: 8px; padding-bottom: 8px; }
    @keyframes tl-in { from { transform: translateY(18px) scale(.97); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .timeline .log-line, .now__icon::after, .now__eq i, .log-line.flash { animation: none; }
    }
    /* Celular: con los dos paneles, uno arriba del otro en vez de lado a lado */
    @media (max-width: 720px) {
      .logs-wrap { flex-direction: column; }
      .logs-panel + .logs-panel { border-left: 0; border-top: 1px solid var(--border); }
      .logs-panel__header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="site-header__brand">
      <span class="brand-name">Brumexa</span>
    </div>
    <nav class="tab-nav"></nav><script src="/nav.js?v=1"></script>
    <div class="site-header__actions">
      <button id="nav-session-btn" class="btn-ghost" type="button" title="Conectar/desconectar la sesión de voz">▶ Conectar</button>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema"></button>
    </div>
  </div>
</header>

<div class="logs-toolbar">
  <div class="logs-toolbar__group">
    <span class="logs-toolbar__label">Ver</span>
    <div class="seg" id="seg-panels">
      <button type="button" data-value="server">Servidor</button>
      <button type="button" data-value="wifi">WiFi</button>
      <button type="button" data-value="both">Ambos</button>
    </div>
  </div>
  <div class="logs-toolbar__group" id="seg-detail-wrap">
    <span class="logs-toolbar__label">Detalle</span>
    <div class="seg" id="seg-detail">
      <button type="button" data-value="simple" title="Solo lo importante, en castellano llano">Simple</button>
      <button type="button" data-value="technical" title="Todo, tal cual lo imprime el server">Técnico</button>
    </div>
  </div>
</div>

<div class="logs-wrap">

  <div class="logs-panel" id="panel-server">
    <div class="logs-panel__header">
      <span class="logs-dot" id="dot-server"></span>
      <span class="logs-panel__title">Servidor (en vivo)</span>
      <input id="filter-server" class="logs-filter" type="search" placeholder="Filtrar (ej. hablar, asistente, error)…" autocomplete="off" />
      <span class="logs-panel__count" id="count-server"></span>
      <button class="btn-ghost" id="btn-clear-server">Limpiar</button>
    </div>
    <!-- "Ahora" — qué está pasando en este momento, en grande (ver NowCard en logs.js) -->
    <div class="now" id="now-server" data-state="listening">
      <div class="now__icon"><span class="now__emoji">👂</span><span class="now__eq"><i></i><i></i><i></i><i></i></span></div>
      <div class="now__text">
        <div class="now__title">Escuchando</div>
        <div class="now__sub">Decí «ei brúmexa» para hablar con el asistente</div>
      </div>
      <div class="now__since"></div>
    </div>
    <div class="logs-body" id="body-server"></div>
    <button class="logs-jump" id="jump-server" type="button" hidden>↓ Ir al último</button>
  </div>

  <div class="logs-panel" id="panel-wifi">
    <div class="logs-panel__header">
      <span class="logs-dot" id="dot-wifi"></span>
      <span class="logs-panel__title">WiFi (persistente)</span>
      <input id="filter-wifi" class="logs-filter" type="search" placeholder="Filtrar (ej. AP, conectado, error)…" autocomplete="off" />
      <span class="logs-panel__count" id="count-wifi"></span>
      <button class="btn-ghost" id="btn-clear-wifi">Limpiar</button>
    </div>
    <div class="logs-body" id="body-wifi"></div>
    <button class="logs-jump" id="jump-wifi" type="button" hidden>↓ Ir al último</button>
  </div>

</div>

<script src="/theme.js?v=1"></script>
<script src="/session-quick.js?v=1"></script>
<script src="/admin-link.js?v=1"></script>
<script src="/logs.js?v=6"></script>

</body>
</html>
