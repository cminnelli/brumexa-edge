<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brumexa — Diagnóstico local</title>
  <link rel="stylesheet" href="local.css" />
</head>
<body>

<header class="header">
  <span class="header-icon">🩺</span>
  <div>
    <div class="header-title">Brumexa — Diagnóstico local</div>
    <div class="header-sub">Situación del dispositivo, sin internet</div>
  </div>
</header>

<main class="page">

  <div class="card span-2" id="card-refresh">
    <div class="status-chip ok" id="chip-refresh">
      <span class="status-dot pulse"></span>
      <span id="txt-refresh">Actualizando…</span>
    </div>
  </div>

  <div class="card" id="card-system">
    <div class="card-title"><span class="ic">🖥️</span>Sistema</div>
    <div class="kv" id="kv-system"></div>
  </div>

  <div class="card" id="card-wifi">
    <div class="card-title"><span class="ic">📶</span>WiFi</div>
    <div class="kv" id="kv-wifi"></div>
  </div>

  <div class="card" id="card-session">
    <div class="card-title"><span class="ic">🔊</span>Sesión LiveKit</div>
    <div class="kv" id="kv-session"></div>
  </div>

  <div class="card" id="card-audio">
    <div class="card-title"><span class="ic">🎙️</span>Audio (ALSA)</div>
    <div id="body-audio"></div>
  </div>

  <div class="card" id="card-bluetooth">
    <div class="card-title"><span class="ic">🔷</span>Bluetooth</div>
    <div id="body-bluetooth"></div>
  </div>

  <div class="card span-2" id="card-wifilog">
    <div class="card-title"><span class="ic">📄</span>Log WiFi (últimas líneas)</div>
    <pre class="dump" id="dump-wifilog"></pre>
  </div>

  <div class="refresh-note">Se actualiza solo cada 6 segundos</div>

</main>

<script>
  const REFRESH_MS = 6000;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function kvRows(pairs) {
    return pairs
      .map(([k, v]) => {
        const val = (v === null || v === undefined || v === '') ? '—' : v;
        return `<div class="kv-row"><span class="k">${k}</span><span class="v">${val}</span></div>`;
      })
      .join('');
  }

  function pill(ok, textOk, textBad) {
    return ok
      ? `<span class="pill ok">${textOk || 'sí'}</span>`
      : `<span class="pill bad">${textBad || 'no'}</span>`;
  }

  // Barra de señal WiFi (5 barras), coloreada segun umbral
  function signalBar(pct) {
    if (pct == null) return '—';
    const level = pct >= 70 ? 'ok' : pct >= 40 ? 'warn' : 'bad';
    const bars = [6, 8, 10, 12, 14];
    const on = Math.max(1, Math.round((pct / 100) * 5));
    const spans = bars.map((h, i) =>
      `<span style="height:${h}px" class="${i < on ? `on ${level}` : ''}"></span>`
    ).join('');
    return `<span class="signal-bar">${spans}</span> <span class="v">${pct}%</span>`;
  }

  function tempBadge(c) {
    if (c == null) return 'no disponible';
    const cls = c >= 75 ? 'bad' : c >= 60 ? 'warn' : 'ok';
    return `<span class="v ${cls}">${c.toFixed(1)} °C</span>`;
  }

  async function refresh() {
    const chip = document.getElementById('chip-refresh');
    const txt  = document.getElementById('txt-refresh');
    try {
      const res = await fetch('/local/status', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      chip.className = 'status-chip ok';
      txt.textContent = `Actualizado ${new Date(data.generatedAt).toLocaleTimeString()}`;

      const sys = data.system || {};
      document.getElementById('kv-system').innerHTML = kvRows([
        ['Hostname', sys.hostname],
        ['Plataforma', `${sys.platform} (${sys.arch})`],
        ['Uptime', sys.uptimeSec != null ? `${Math.floor(sys.uptimeSec / 60)} min` : null],
        ['Memoria libre', sys.freeMemMB != null ? `${sys.freeMemMB} / ${sys.totalMemMB} MB` : null],
        ['Temp. CPU', tempBadge(sys.cpuTempC)],
      ]);

      const wifi = data.wifi || {};
      document.getElementById('kv-wifi').innerHTML = wifi.error
        ? `<div class="section-empty">Error: ${esc(wifi.error)}</div>`
        : kvRows([
            ['SSID conectado', wifi.connectedSSID],
            ['IP', wifi.ipAddress],
            ['Señal', signalBar(wifi.signal)],
            ['AP activo', pill(wifi.apActive)],
            ['AP SSID/IP', wifi.apSsid ? `${wifi.apSsid} — ${wifi.apIp}` : null],
          ]);

      const session = data.session || {};
      document.getElementById('kv-session').innerHTML = session.error
        ? `<div class="section-empty">Error: ${esc(session.error)}</div>`
        : (data.session ? kvRows([
            ['Estado', session.status],
            ['Sala', session.roomName],
            ['Conectado', pill(session.isConnected)],
            ['Mic activo', pill(session.micActive)],
            ['Speaker activo', pill(session.speakerActive)],
            ['Reintentando', pill(session.isReconnecting, 'sí', 'no')],
          ]) : '<div class="section-empty">no disponible</div>');

      const audio = data.audio || {};
      document.getElementById('body-audio').innerHTML = audio.available
        ? `<pre class="dump">${esc([audio.arecordList, audio.aplayList, audio.alsaProcs].filter(Boolean).join('\n\n') || '(sin datos)')}</pre>`
        : '<div class="section-empty">no disponible en esta plataforma</div>';

      const bt = data.bluetooth || {};
      document.getElementById('body-bluetooth').innerHTML = bt.available
        ? `<pre class="dump">Emparejados:\n${esc(bt.paired || '(ninguno)')}\n\nConectados:\n${esc(bt.connected || '(ninguno)')}</pre>`
        : '<div class="section-empty">no disponible en esta plataforma</div>';

      document.getElementById('dump-wifilog').textContent = data.wifiLog || '(sin registros todavía)';
    } catch (e) {
      chip.className = 'status-chip error';
      txt.textContent = `Error: ${e.message}`;
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>

</body>
</html>
