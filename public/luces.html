<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estilos de luces · Brumexa</title>
<style>
  :root { --bg: #0f0d16; --card: #191624; --line: #2a2538; --text: #ece9f5; --muted: #9a94ad; --accent: #8b7cf6; --ok: #34d399; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 22px; }
  h2 { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
  .styles { display: grid; gap: 10px; }
  .style { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%; }
  .style:hover { border-color: #3d3552; }
  .style.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .style b { display: flex; align-items: center; gap: 8px; font-size: 1rem; }
  .style b .tag { font-size: .7rem; font-weight: 600; color: var(--ok); border: 1px solid var(--ok); border-radius: 99px; padding: 1px 8px; }
  .style span { display: block; color: var(--muted); margin-top: 4px; font-size: .9rem; }
  .states { display: flex; flex-wrap: wrap; gap: 8px; }
  button.state, button.cycle { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 99px; padding: 9px 16px; font: inherit; cursor: pointer; }
  button.state:hover, button.cycle:hover { border-color: var(--accent); }
  button.state.now { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.cycle { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; margin-top: 12px; }
  #msg { margin-top: 14px; color: var(--muted); min-height: 1.4em; }
  #msg.err { color: #f87171; }
</style>
</head>
<body>
<main>
  <h1>Estilos de luces</h1>
  <p class="sub">Página de prueba (no está en el menú). Elegí un estilo y mirá cada estado en la tira de la Brumexa. El estilo elegido queda guardado.</p>

  <h2>1 · Estilo</h2>
  <div class="styles" id="styles"></div>

  <h2>2 · Estado</h2>
  <div class="states" id="states"></div>
  <button class="cycle" id="cycle">▶ Ver el ciclo completo de una charla</button>
  <div id="msg"></div>
</main>
<script>
const STATES = [
  ['dormida', 'Dormida'], ['despierta', 'Se despierta'], ['escucha', 'Te escucha'],
  ['piensa', 'Piensa'], ['habla', 'Habla'], ['espera', 'Te espera'], ['duerme', 'Se duerme'],
];
const $ = (id) => document.getElementById(id);
const say = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };
let cycleTimer = null;

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.error || 'No se pudo');
  return j;
}

async function loadStyles() {
  const j = await (await fetch('/diag/leds/estilos')).json();
  $('styles').innerHTML = '';
  for (const s of j.styles) {
    const b = document.createElement('button');
    b.className = 'style' + (s.active ? ' on' : '');
    b.innerHTML = `<b>${s.label}${s.active ? '<span class="tag">activo</span>' : ''}</b><span>${s.desc}</span>`;
    b.onclick = async () => {
      try { await post('/diag/leds/estilo', { style: s.key }); say(`Estilo "${s.label}" activo.`); loadStyles(); }
      catch (e) { say(e.message, true); }
    };
    $('styles').appendChild(b);
  }
}

function markState(key) {
  for (const b of $('states').children) b.classList.toggle('now', b.dataset.k === key);
}
async function show(key) {
  try { await post('/diag/leds/demo', { state: key }); markState(key); say(''); }
  catch (e) { say(e.message, true); }
}
for (const [k, label] of STATES) {
  const b = document.createElement('button');
  b.className = 'state'; b.dataset.k = k; b.textContent = label;
  b.onclick = () => { clearTimeout(cycleTimer); show(k); };
  $('states').appendChild(b);
}

// Una charla típica: dormida → la llamás → te escucha → piensa → (habla) → te espera → se duerme.
const CYCLE = [['dormida', 4000], ['despierta', 900], ['escucha', 3500], ['piensa', 3500], ['habla', 4500], ['espera', 6000], ['duerme', 1800], ['dormida', 0]];
$('cycle').onclick = () => {
  clearTimeout(cycleTimer);
  let i = 0;
  const step = async () => {
    const [k, ms] = CYCLE[i++];
    await show(k);
    if (i < CYCLE.length) cycleTimer = setTimeout(step, ms);
  };
  step();
};

loadStyles().catch(() => say('No se pudo leer los estilos.', true));
</script>
</body>
</html>
