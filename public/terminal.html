<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brumexa — Terminal Pi</title>
  <!-- Red de seguridad contra íconos SVG "gigantes" antes de que cargue
       style.css — ver el mismo comentario en public/index.html. -->
  <style>svg { width: 1em; height: 1em; }</style>
  <script>
    (function () {
      var t = localStorage.getItem('brumexa-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- No-bloqueante (media=print + onload) — ver el comentario grande en
       public/local.html: esta página también se ve conectado al AP de
       emergencia, sin internet real, y un <link rel=stylesheet> normal a
       un dominio externo sin ruta a internet traba el render entero. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="style.css?v=22" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
    .terminal-wrap { flex: 1; min-height: 0; display: flex; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="site-header__brand">
      <span class="brand-name">Brumexa</span>
    </div>
    <nav class="tab-nav">
      <a class="tab-btn" href="/">Panel</a>
      <a class="tab-btn" href="/configuracion">Configuración</a>
      <a class="tab-btn" href="/diagnostico">Diagnóstico</a>
      <a class="tab-btn" href="/logs">Logs</a>
      <a class="tab-btn active" href="/terminal">Terminal Pi</a>
      <a class="tab-btn" href="/local">Local</a>
      <a class="tab-btn" href="#" id="nav-admin">Admin</a>
    </nav>
    <div class="site-header__actions">
      <button id="nav-session-btn" class="btn-ghost" type="button" title="Conectar/desconectar la sesión de voz">▶ Conectar</button>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema"></button>
    </div>
  </div>
</header>

<div id="terminal-section" class="terminal-wrap">

  <!-- Sidebar: categorías y comandos -->
  <aside class="term-sidebar">
    <div class="term-sidebar__header">
      <span>Comandos</span>
      <span class="term-sidebar__hint">Clic para ejecutar</span>
    </div>
    <!-- Buscador -->
    <div class="term-search-wrap">
      <span class="term-search-icon">🔍</span>
      <input id="term-search" class="term-search" type="search"
             placeholder="Buscar comando…" autocomplete="off" />
    </div>
    <div id="term-groups" class="term-groups"></div>
    <div class="term-custom">
      <div class="term-custom__label">Comando libre</div>
      <div class="term-input-row">
        <span class="term-prompt">$</span>
        <input id="term-input" class="term-input" type="text"
               placeholder="bash comando…" autocomplete="off" spellcheck="false" />
      </div>
      <button id="btn-term-run" class="btn-term-run">Ejecutar ↵</button>
    </div>
  </aside>

  <!-- Output -->
  <div class="term-main">
    <div class="term-main__header">
      <span class="term-main__title">Output</span>
      <button class="btn-ghost" id="btn-term-clear">Limpiar</button>
    </div>
    <div id="term-output" class="term-output"></div>
  </div>

</div><!-- #terminal-section -->

<script src="theme.js?v=1"></script>
<script src="session-quick.js?v=1"></script>
<script src="admin-link.js?v=1"></script>
<script src="terminal.js?v=15"></script>
<script>
  TerminalModule.init();
</script>

</body>
</html>
