<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brumexa — Terminal Pi</title>
  <!-- Red de seguridad contra íconos SVG "gigantes" antes de que cargue
       style.css — ver el mismo comentario en public/index.html. -->
  <style>svg { width: 1em; height: 1em; }</style>
  <script>
    (function () {
      var t = localStorage.getItem('brumexa-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- No-bloqueante (media=print + onload) — ver el comentario grande en
       public/local.html: esta página también se ve conectado al AP de
       emergencia, sin internet real, y un <link rel=stylesheet> normal a
       un dominio externo sin ruta a internet traba el render entero. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="style.css?v=22" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
    .terminal-wrap { flex: 1; min-height: 0; display: flex; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="site-header__brand">
      <span class="brand-name">Brumexa</span>
    </div>
    <nav class="tab-nav">
      <a class="tab-btn" href="/" title="Panel"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span class="tab-btn__label">Panel</span></a>
      <a class="tab-btn" href="/configuracion" title="Configuración"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="tab-btn__label">Configuración</span></a>
      <a class="tab-btn" href="/diagnostico" title="Diagnóstico"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg><span class="tab-btn__label">Diagnóstico</span></a>
      <a class="tab-btn" href="/logs" title="Logs"><svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg><span class="tab-btn__label">Logs</span></a>
      <a class="tab-btn active" href="/terminal" title="Terminal Pi"><svg viewBox="0 0 24 24"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg><span class="tab-btn__label">Terminal Pi</span></a>
      <a class="tab-btn" href="/local" title="Local"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg><span class="tab-btn__label">Local</span></a>
      <a class="tab-btn" href="#" id="nav-admin" title="Admin"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z"/></svg><span class="tab-btn__label">Admin</span></a>
    </nav>
    <div class="site-header__actions">
      <button id="nav-session-btn" class="btn-ghost" type="button" title="Conectar/desconectar la sesión de voz">▶ Conectar</button>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema"></button>
    </div>
  </div>
</header>

<div id="terminal-section" class="terminal-wrap">

  <!-- Sidebar: categorías y comandos -->
  <aside class="term-sidebar">
    <div class="term-sidebar__header">
      <span>Comandos</span>
      <span class="term-sidebar__hint">Clic para ejecutar</span>
    </div>
    <!-- Buscador -->
    <div class="term-search-wrap">
      <span class="term-search-icon">🔍</span>
      <input id="term-search" class="term-search" type="search"
             placeholder="Buscar comando…" autocomplete="off" />
    </div>
    <div id="term-groups" class="term-groups"></div>
    <div class="term-custom">
      <div class="term-custom__label">Comando libre</div>
      <div class="term-input-row">
        <span class="term-prompt">$</span>
        <input id="term-input" class="term-input" type="text"
               placeholder="bash comando…" autocomplete="off" spellcheck="false" />
      </div>
      <button id="btn-term-run" class="btn-term-run">Ejecutar ↵</button>
    </div>
  </aside>

  <!-- Output -->
  <div class="term-main">
    <div class="term-main__header">
      <span class="term-main__title">Output</span>
      <button class="btn-ghost" id="btn-term-clear">Limpiar</button>
    </div>
    <div id="term-output" class="term-output"></div>
  </div>

</div><!-- #terminal-section -->

<script src="theme.js?v=1"></script>
<script src="session-quick.js?v=1"></script>
<script src="admin-link.js?v=1"></script>
<script src="terminal.js?v=15"></script>
<script>
  TerminalModule.init();
</script>

</body>
</html>
